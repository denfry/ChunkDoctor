name: Bug report
description: Report incorrect behavior or a reproducible failure
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ChunkDoctor version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper build and Java version
      placeholder: Paper 1.21.8 build …, Java 21
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you do, what did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, player data, IP addresses, and private paths.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      render: yaml
