name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should ChunkDoctor solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Performance and thread-safety considerations
      description: Could this load chunks, scan blocks, perform I/O, or touch Bukkit asynchronously?
