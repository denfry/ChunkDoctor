name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $version" >&2
            exit 1
          fi
          ./gradlew clean build --no-daemon --warning-mode all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          artifact="$(find build/libs -maxdepth 1 -name 'ChunkDoctor-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$artifact"
          gh release create "$RELEASE_TAG" "$artifact" --generate-notes --verify-tag
