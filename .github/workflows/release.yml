name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $version" >&2
            exit 1
          fi
          ./gradlew clean build --no-daemon --warning-mode all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          artifact="$(find build/libs -maxdepth 1 -name 'ChunkDoctor-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$artifact"
          gh release create "$RELEASE_TAG" "$artifact" --generate-notes --verify-tag
